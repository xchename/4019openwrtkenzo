name: Build OpenWrt (Official)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

  UPLOAD_FIRMWARE: true

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Node.js 24
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # =========================
      # 初始化环境
      # =========================
      - name: Initialization environment
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath \
            swig \
            time

          sudo timedatectl set-timezone "$TZ"

      # =========================
      # Clone Official OpenWrt
      # =========================
      - name: Clone source code
        run: |
          git clone --depth=1 \
            -b "$REPO_BRANCH" \
            "$REPO_URL" openwrt

      # =========================
      # 显示版本
      # =========================
      - name: Show OpenWrt version
        run: |
          cd openwrt
          git log -1 --oneline
          echo "OpenWrt branch: $REPO_BRANCH"

      # =========================
      # Cache dl
      # =========================
      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      # =========================
      # 自定义 feeds
      # =========================
      - name: Load custom feeds
        run: |
          [ -e feeds.conf.default ] && mv feeds.conf.default openwrt/

          if [ -f "$DIY_P1_SH" ]; then
            chmod +x "$DIY_P1_SH"
            cd openwrt
            ../"$DIY_P1_SH"
            cd ..
          fi

      # =========================
      # Update feeds
      # =========================
      - name: Update & Install feeds
        run: |
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # =========================
      # 加载配置
      # =========================
      - name: Load configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config

          if [ -f "$DIY_P2_SH" ]; then
            chmod +x "$DIY_P2_SH"
            cd openwrt
            ../"$DIY_P2_SH"
            cd ..
          fi

      # =========================
      # 检查目标设备
      # =========================
      - name: Check target
        run: |
          cd openwrt

          grep CONFIG_TARGET_qualcommax .config || true
          grep CONFIG_TARGET_qualcommax_ipq60xx .config || true
          grep CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01 .config || true

      # =========================
      # 检查 firewall4 / nftables
      # =========================
      - name: Check firewall configuration
        run: |
          cd openwrt

          echo "===== firewall4 ====="
          grep CONFIG_PACKAGE_firewall4 .config || true

          echo "===== nftables ====="
          grep CONFIG_PACKAGE_nftables .config || true

          echo "===== nft modules ====="
          grep 'CONFIG_PACKAGE_kmod-nft-' .config || true

          echo "===== dnsmasq ====="
          grep 'CONFIG_PACKAGE_dnsmasq' .config || true

          echo "===== PassWall ====="
          grep 'CONFIG_PACKAGE_luci-app-passwall' .config || true

      # =========================
      # SSH 调试
      # =========================
      - name: SSH connection
        uses: P3TERX/ssh2actions@v1.0.0
        if: github.event.inputs.ssh == 'true'

      # =========================
      # 生成最终配置
      # =========================
      - name: Defconfig
        run: |
          cd openwrt
          make defconfig

      # =========================
      # 再次检查最终配置
      # =========================
      - name: Verify final config
        run: |
          cd openwrt

          echo "===== TARGET ====="
          grep '^CONFIG_TARGET.*=y' .config || true

          echo "===== FIREWALL ====="
          grep -E '^CONFIG_PACKAGE_(firewall4|nftables|dnsmasq-full)=y' .config || true

          echo "===== NFT ====="
          grep '^CONFIG_PACKAGE_kmod-nft-' .config || true

          echo "===== PASSWALL ====="
          grep '^CONFIG_PACKAGE_luci-app-passwall' .config || true

      # =========================
      # 下载依赖
      # =========================
      - name: Download packages
        run: |
          cd openwrt

          make download -j8

          find dl -size -1024c -delete

      # =========================
      # 编译
      # =========================
      - name: Compile
        id: compile
        run: |
          cd openwrt

          set -e

          make -j$(nproc) V=s

          echo "status=success" >> "$GITHUB_OUTPUT"

          DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' \
            | head -n1)

          echo "DEVICE_NAME=_${DEVICE}" >> "$GITHUB_ENV"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      # =========================
      # 整理固件
      # =========================
      - name: Organize firmware
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*

          rm -rf packages

          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

      # =========================
      # 上传固件
      # =========================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: OpenWrt${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      # =========================
      # 清理旧 Artifact
      # =========================
      - name: Delete old artifacts
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts" \
            --paginate \
            --jq '.artifacts[] | select(.expired==false) | .id' \
            | tail -n +10 \
            | while read id; do
                gh api -X DELETE \
                  "repos/${{ github.repository }}/actions/artifacts/$id"
              done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
